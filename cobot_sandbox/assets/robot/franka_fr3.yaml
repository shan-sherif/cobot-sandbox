# Franka Research 3 + Franka Hand, built from MuJoCo Menagerie (scripts/fetch_models.py).
# Joint/torque limits from the Menagerie model (Franka datasheet values); servo gains are ours.
name: franka_fr3
title: Franka FR3 (7-DOF) + Franka Hand
source: menagerie
arm: franka_fr3/fr3.xml
gripper_model: {file: franka_emika_panda/hand.xml, attach_site: attachment_site, prefix: grip_}

arm_joints: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
arm_actuators: [fr3_joint1_motor, fr3_joint2_motor, fr3_joint3_motor, fr3_joint4_motor,
                fr3_joint5_motor, fr3_joint6_motor, fr3_joint7_motor]
home: [-0.1017, -0.3256, 0.0923, -2.3065, 0.0324, 1.9814, -0.0276]   # solved by scripts/robot_home.py (TCP 0.45, 0, 0.37, tool down)

kp: [600, 600, 600, 500, 150, 120, 60]
kd: [40, 40, 40, 30, 8, 6, 3]
torque_limits: [87, 87, 87, 87, 12, 12, 12]
max_joint_vel: [2.0, 2.0, 2.0, 2.0, 2.5, 2.5, 2.5]
max_following_error: [0.05, 0.05, 0.05, 0.05, 0.1, 0.1, 0.1]
max_tcp_lag: 0.03

tcp: {body: grip_hand, pos: [0, 0, 0.1034]}    # between the fingertips
wrist_camera: {body: grip_hand, pos: [0.06, 0, 0.03], xyaxes: [0, 1, 0, 0.958, 0, 0.287], fovy: 70}
ft_site: attachment_site
gripper: {actuator: grip_actuator8, open: 255, closed: 0}
width: {joints: [grip_finger_joint1, grip_finger_joint2], scale: 1.0}
finger_bodies: [[grip_left_finger], [grip_right_finger]]
reach: [0.30, 0.78]

limits: {ee_lin: 0.25, ee_ang: 1.2}
ik: {damping: 0.05, null_gain: 0.05, iters: 3, rot_weight: 0.5}
