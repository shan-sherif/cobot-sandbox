# Scene schema reference. Copy this file to make a new scene, naming it NN_<name>.yaml: the number
# sets the order (in `python run.py --list`, the scene menu and the [ / ] switcher) and <name> is
# what --scene takes, e.g. 04_my_scene.yaml -> `python run.py --scene my_scene`. Files starting
# with "_" are ignored; a file without a number is listed last.
# Distances are metres, angles are degrees (yaw_deg). Everything except `name` is optional.
name: my_scene
title: My scene             # optional: display name (default: name)
description: One line shown in the HUD.

environment:
  floor: {size: [5, 5], material: concrete}        # material: builtin | texture stem | [r,g,b] | {texture, repeat, rgba}
  sky: {top: [0.52, 0.62, 0.76], bottom: [0.08, 0.10, 0.13]}
  walls: {height: 1.0, material: [0.75, 0.76, 0.78]}   # omit for an open floor
  lights:                                           # omit for the default 2-light rig
    - {pos: [2.5, -2, 4], dir: [-0.45, 0.35, -1], diffuse: [0.75, 0.72, 0.68], shadow: true}

physics: {timestep: 0.001, impratio: 1}      # impratio > 1 resists grasp slip but is less robust

recording: true               # false: Enter / collect.py refuse to record here (e.g. the test bench)

# Robots on mounts. Robot names = assets/robot/<name>.yaml (franka_fr3, ur5e).
#   select: one -> the user picks one of the listed robots (picker; remembered in settings.yaml)
#   select: all -> every listed robot is simulated, Tab switches which one you control
# Missing (not downloaded) robots are skipped; with none left the scene won't load (run fetch_models.py).
robots:
  select: one
  mounts:
    - {robot: franka_fr3, pos: [0, 0], yaw_deg: 0}   # stand: pedestal (default; mount at z 0.28) | null with z: <m>
    - {robot: ur5e, pos: [0, 0]}                     # label: "text" shows a name above it (select: all)

# Static furniture. `on:` stacks a fixture on another fixture's top surface.
fixtures:
  - {name: table_a, type: table, pos: [0.62, 0], size: [0.28, 0.5], height: 0.40, material: wood}
  - {name: bin_a, type: bin, on: table_a, pos: [0.55, -0.32], size: [0.1, 0.1, 0.08], color: [0.2, 0.45, 0.75]}
  - {name: crate, type: box, pos: [1.5, -1], size: [0.2, 0.2, 0.2], material: wood}
  - {name: hole_a, type: hole, on: table_a, pos: [0.5, 0.3], size: [0.05, 0.05, 0.025], hole: 0.016}  # peg hole (half-width)
  - {name: goal, type: target, on: table_a, pos: [0.6, 0.2], size: [0.035, 0.035], color: [0.2, 0.9, 0.4, 0.55]}  # flat marker

# Graspable rigid objects. Give pos [x, y] (z is found from the surface below) and/or
# `on: <fixture>` (object is re-sampled on that fixture when randomization is on).
objects:
  - {name: red_cube, type: cube, size: 0.025, pos: [0.55, 0.05], color: [0.9, 0.2, 0.2], mass: 0.08}
  - {name: blue_ball, type: ball, size: 0.03, on: table_a, mass: 0.06}
  - {name: can, type: cylinder, size: [0.025, 0.045], on: table_a}
  - {name: brick, type: box, size: [0.04, 0.02, 0.02], on: table_a}

# Procedural clutter: N random objects on a fixture (deterministic for a given scene seed).
spawn:
  - {on: table_a, count: 4, types: [cube, ball, cylinder], size_range: [0.02, 0.03], prefix: item}

# Success checks (cobot_sandbox/tasks.py): shown as a HUD checklist, solved by `--policy task`, used as the
# CobotEnv reward. Optional `text:` (label) and `robot:` (which robot it belongs to, for select: all).
tasks:
  - {type: lift, object: red_cube, height: 0.10}
  - {type: place, object: blue_ball, in: bin_a}
  # {type: stack, object: a, on: b} | {type: push, object: a, to: goal, tol: 0.03} | {type: insert, object: peg, into: hole_a}

# Floating text in the app view. on_robot: true makes pos relative to the active robot's mount.
labels:
  - {text: "start here", pos: [0, 0, 1.1], on_robot: true}

# Starting camera in the app (free camera). follow: false keeps it still while you drive.
view: {lookat: [0, 0, 0.4], distance: 2.6, azimuth: 145, elevation: -24, follow: true}

# Fixed cameras (also available as image observations for learning).
cameras:
  - {name: overview, pos: [1.8, -1.4, 1.5], lookat: [0.5, 0, 0.4], fovy: 45}

# Domain randomization applied on reset when randomization is enabled (run.py --randomize,
# CobotEnv(randomize=True), scripts/collect.py does it by default).
randomize:
  object_xy: 0.04             # jitter (m) for objects with a fixed pos and no `on:`
  object_yaw: true
  friction_scale: [0.7, 1.3]
  mass_scale: [0.7, 1.4]
  object_colors: false        # randomize object colours (useful for vision policies)
  light_jitter: 0.25          # +/- fraction of light intensity
