name: pick_place
title: Pick and place
description: Put all four objects in the bin (robosuite-style PickPlace).

# Benchmark-style scene: one robot, chosen when the scene loads (remembered in settings.yaml).
# Layout recreated in this sandbox's format, not the original benchmark's assets.
robots:
  select: one
  mounts:
    - {robot: franka_fr3, pos: [0, 0]}
    - {robot: ur5e, pos: [0, 0]}

environment:
  floor: {size: [3, 3], material: concrete}

fixtures:
  - {name: table, type: table, pos: [0.62, 0], size: [0.3, 0.45], height: 0.40, material: wood}
  - {name: bin, type: bin, on: table, pos: [0.5, -0.27], size: [0.14, 0.14, 0.06], color: [0.2, 0.45, 0.75]}

objects:
  - {name: cube, type: cube, size: 0.022, pos: [0.46, 0.1], color: [0.9, 0.2, 0.2]}
  - {name: can, type: cylinder, size: [0.022, 0.04], pos: [0.58, 0.2], color: [0.95, 0.7, 0.1]}
  - {name: brick, type: box, size: [0.035, 0.018, 0.018], pos: [0.62, 0.05], color: [0.2, 0.75, 0.35]}
  - {name: block, type: cube, size: 0.018, pos: [0.5, 0.25], color: [0.6, 0.35, 0.85]}

tasks:
  - {type: place, object: cube, in: bin}
  - {type: place, object: can, in: bin}
  - {type: place, object: brick, in: bin}
  - {type: place, object: block, in: bin}

randomize: {object_xy: 0.04, object_yaw: true, friction_scale: [0.7, 1.3], mass_scale: [0.7, 1.4], light_jitter: 0.2}

cameras:
  - {name: overview, pos: [1.7, -1.1, 1.25], lookat: [0.5, 0, 0.42], fovy: 45}
  - {name: front, pos: [1.25, 0.0, 0.95], lookat: [0.5, 0, 0.4], fovy: 55}
