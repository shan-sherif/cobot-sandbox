# Runs the test suite on Linux, Windows and macOS for every push and pull request.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:                                   # oldest / newest supported Python, on Linux
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
    env:
      SDL_VIDEODRIVER: dummy                       # no windows on CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Software OpenGL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libosmesa6
          echo "MUJOCO_GL=osmesa" >> "$GITHUB_ENV"
      - name: Install (same script users run)
        run: python install.py
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install -q -e ".[dev]"
          "$PY" -m pytest -q -rs tests

  package:
    name: wheel builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine && python -m build && python -m twine check dist/*
      - name: Install the wheel and run it from another folder
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install -q dist/*.whl
          cd /tmp && COBOT_SANDBOX_HOME=/tmp/home /tmp/w/bin/cobot-sandbox --list
          COBOT_SANDBOX_HOME=/tmp/home /tmp/w/bin/cobot-sandbox-collect --scene lift --robot ur5e --episodes 1
